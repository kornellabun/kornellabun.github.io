<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none" stroke-width="12" stroke-linecap="round">
  <!-- The DNA Rungs (Yellow) -->
  <!-- These are drawn first, so they appear BEHIND the brackets -->
  <line x1="25" y1="35" x2="73" y2="35" stroke="#eab308" stroke-width="8" />
  <line x1="15" y1="50" x2="83" y2="50" stroke="#eab308" stroke-width="8" />
  <line x1="25" y1="65" x2="73" y2="65" stroke="#eab308" stroke-width="8" />

  <!-- Left Side Bracket (Red) -->
  <path d="M 35 15 L 15 50 L 35 85" stroke="#ef4444" />
  
  <!-- Right Side Bracket (Red) -->
  <path d="M 65 15 L 85 50 L 65 85" stroke="#ef4444" />
</svg>